name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Run Tests
        run: go test -v -race ./...

      - name: Build Binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o tg-transfer-bot-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o tg-transfer-bot-linux-arm64 .
          tar -czf tg-transfer-bot-linux-amd64.tar.gz tg-transfer-bot-linux-amd64
          tar -czf tg-transfer-bot-linux-arm64.tar.gz tg-transfer-bot-linux-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tg-transfer-bot-linux-amd64
            tg-transfer-bot-linux-arm64
            tg-transfer-bot-linux-amd64.tar.gz
            tg-transfer-bot-linux-arm64.tar.gz
          generate_release_notes: true
